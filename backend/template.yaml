AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Enarya FX serverless backend (API, rates cache, accounts, watchlists, price alerts, static hosting)

Parameters:
  SiteOrigin:
    Type: String
    Default: https://utopiafintech.github.io
    Description: Origin allowed to call the API (CORS). Use your CloudFront URL once the site is hosted on AWS.
  CallbackUrl:
    Type: String
    Default: https://utopiafintech.github.io/EnaryaFX/
    Description: Where Cognito sends users after login/logout (must match the page that handles login).
  AlertFromEmail:
    Type: String
    Description: Sender address for price-alert emails. Must be verified in Amazon SES.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        ALERT_FROM_EMAIL: !Ref AlertFromEmail

Resources:
  # ---------- Database (single table) ----------
  # pk=RATES  sk=LATEST            cached rate series
  # pk=NEWS   sk=LATEST            news items
  # pk=USER#<sub> sk=WATCHLIST     the user's watched pairs
  # pk=USER#<sub> sk=ALERT#<id>    the user's price alerts
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- Accounts (Cognito) ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: enarya-fx-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Ref CallbackUrl]
      LogoutURLs: [!Ref CallbackUrl]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub enarya-fx-${AWS::AccountId}

  # ---------- HTTP API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  # ---------- Rates: scheduled fetcher + public read API ----------
  FetchRatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/fetchRates.handler
      CodeUri: .
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DataTable }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)

  GetRatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/getRates.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref DataTable }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /rates, Method: GET }

  GetNewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/getNews.handler
      CodeUri: .
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref DataTable }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /news, Method: GET }

  # ---------- Signed-in features ----------
  WatchlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/watchlist.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DataTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /watchlist, Method: GET, Auth: { Authorizer: CognitoAuth } }
        Put:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /watchlist, Method: PUT, Auth: { Authorizer: CognitoAuth } }

  AlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/alerts.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DataTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /alerts, Method: GET, Auth: { Authorizer: CognitoAuth } }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /alerts, Method: POST, Auth: { Authorizer: CognitoAuth } }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/alerts/{id}', Method: DELETE, Auth: { Authorizer: CognitoAuth } }

  CheckAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/checkAlerts.handler
      CodeUri: .
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DataTable }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)

  # ---------- Static site hosting (S3 + CloudFront) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub enarya-fx-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed CachingOptimized

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

Outputs:
  ApiUrl:
    Description: Put this in API_BASE in index.html
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  HostedUiDomain:
    Value: !Sub https://enarya-fx-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Value: !Sub https://${SiteDistribution.DomainName}
  CloudFrontDistributionId:
    Value: !Ref SiteDistribution
